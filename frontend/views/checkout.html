<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h2 class="mb-4">Checkout</h2>
            <form id="checkout-form">
                <div class="mb-3">
                    <label class="form-label">Delivery Address</label>
                    <textarea name="address" class="form-control" rows="3" required></textarea>
                </div>
                
                <div class="bg-light p-4 rounded">
                    <h4>Order Summary</h4>
                    <div id="checkout-items"></div>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <h5>Total:</h5>
                        <h5 id="checkout-total">KM 0.00</h5>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary mt-3 w-100">Place Order</button>
            </form>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    
    const itemsContainer = $('#checkout-items');
    const totalElement = $('#checkout-total');
    let total = 0;
    
    cart.forEach(item => {
        const itemTotal = item.product.price * item.quantity;
        total += itemTotal;
        itemsContainer.append(`
            <div class="d-flex justify-content-between mb-2">
                <span>${item.product.name} x ${item.quantity}</span>
                <span>KM ${itemTotal.toFixed(2)}</span>
            </div>
        `);
    });
    
    totalElement.text(`KM ${total.toFixed(2)}`);
    
   
    $('#checkout-form').on('submit', function(e) {
        e.preventDefault();
        
        if (cart.length === 0) {
            toastr.error("Your cart is empty");
            return;
        }
        
        const formData = Object.fromEntries(new FormData(this).entries());
        
        OrderService.createOrder(formData, cart, function() {
            cart = [];
            window.location.hash = "#home";
        });
    });
});
</script>
